<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palette Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e0e0e0;font-family:monospace;padding:2rem;min-height:100vh}
h1{font-size:1.2rem;margin-bottom:1.5rem;color:#7fdbca;text-align:center}
.palette-grid{display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center}
.palette-card{background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:1rem;min-width:280px;max-width:360px}
.palette-name{font-size:.9rem;color:#7fdbca;margin-bottom:.5rem;font-weight:bold}
.palette-meta{font-size:.7rem;color:#83769c;margin-bottom:.8rem}
.swatch-grid{display:flex;flex-wrap:wrap;gap:2px}
.swatch{width:28px;height:28px;border-radius:3px;cursor:pointer;position:relative;border:1px solid #0004}
.swatch:hover{transform:scale(1.3);z-index:1;box-shadow:0 0 8px #fff4}
.swatch .tooltip{display:none;position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:2px 6px;font-size:.65rem;white-space:nowrap;border-radius:3px;z-index:2}
.swatch:hover .tooltip{display:block}
.upload{text-align:center;margin-bottom:1.5rem}
input[type="file"]{font-size:.8rem}
.compare{display:flex;gap:1rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.compare-slot{width:80px;height:80px;border:2px dashed #533483;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:#83769c;cursor:pointer}
</style>
</head>
<body>
<h1>Palette Viewer & Comparator</h1>
<div class="upload">
  <input type="file" id="files" accept=".json" multiple>
  <span style="font-size:.75rem;color:#83769c"> — Load palette JSON files</span>
</div>
<div class="compare" id="compare">
  <div class="compare-slot" id="slot1">Click swatch<br>to compare</div>
  <div class="compare-slot" id="slot2">Click another<br>swatch</div>
</div>
<div class="palette-grid" id="grid"></div>

<script>
const grid=document.getElementById('grid');
let slot=1;

function renderPalette(data){
  const card=document.createElement('div');card.className='palette-card';
  card.innerHTML=`<div class="palette-name">${data.name}</div><div class="palette-meta">${data.max_colors} colors${data.description?' — '+data.description:''}</div>`;
  const sg=document.createElement('div');sg.className='swatch-grid';
  data.colors.forEach(c=>{
    const s=document.createElement('div');s.className='swatch';s.style.background=c;
    s.innerHTML=`<span class="tooltip">${c}</span>`;
    s.onclick=()=>{
      const el=document.getElementById('slot'+slot);
      el.style.background=c;el.style.border='2px solid '+c;
      el.innerHTML=`<span style="color:${isLight(c)?'#000':'#fff'};font-size:.65rem">${c}</span>`;
      slot=slot===1?2:1;
    };
    sg.appendChild(s);
  });
  card.appendChild(sg);grid.appendChild(card);
}

function isLight(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return(r*299+g*587+b*114)/1000>128;
}

// Built-in palettes
const builtIn=[
  {name:"pico-8",max_colors:16,description:"Fantasy console",colors:["#000000","#1D2B53","#7E2553","#008751","#AB5236","#5F574F","#C2C3C7","#FFF1E8","#FF004D","#FFA300","#FFEC27","#00E436","#29ADFF","#83769C","#FF77A8","#FFCCAA"]},
  {name:"gameboy",max_colors:4,description:"DMG-01",colors:["#0F380F","#306230","#8BAC0F","#9BBC0F"]},
  {name:"sweetie-16",max_colors:16,description:"Game jam favorite",colors:["#1A1C2C","#5D275D","#B13E53","#EF7D57","#FFCD75","#A7F070","#38B764","#257179","#29366F","#3B5DC9","#41A6F6","#73EFF7","#F4F4F4","#94B0C2","#566C86","#333C57"]},
];
builtIn.forEach(renderPalette);

document.getElementById('files').addEventListener('change',e=>{
  Array.from(e.target.files).forEach(f=>{
    const r=new FileReader();r.onload=ev=>{try{renderPalette(JSON.parse(ev.target.result))}catch(err){console.error(err)}};
    r.readAsText(f);
  });
});
</script>
</body>
</html>
